<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Poke API</title>
    <link href="./css/normalize.css" rel="stylesheet"/>
    <link href="./css/style.css" rel="stylesheet"/>
    <script defer src="./js/script.js"></script>
</head>
<body>

<header>
    <h1>PokéDex</h1>
    <section id="filtre">
        <h2>Sélectionner la génération :</h2>
        <div class="select">
            <select id="genSelect">
                <option value="0">Toutes les générations</option>
                <option value="1">Génération 1</option>
                <option value="2">Génération 2</option>
                <option value="3">Génération 3</option>
                <option value="4">Génération 4</option>
                <option value="5">Génération 5</option>
                <option value="6">Génération 6</option>
                <option value="7">Génération 7</option>
                <option value="8">Génération 8</option>
                <option value="9">Génération 9</option>
            </select>
        </div>
    </section>

    <section id="sort">
        <h2>Trier par :</h2>
        <div class="select">
            <select id="sortCriteria">
                <option value="name">Nom</option>
                <option value="hp">Points de vie</option>
                <option value="atk">Attaque</option>
            </select>
        </div>
    </section>
</header>

<section id="types"></section>

<main></main>

</body>
</html>
